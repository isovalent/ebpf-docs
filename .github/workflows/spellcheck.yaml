name: Spellcheck

on:
  pull_request: {}
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  USER: root

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run spellcheck
        run: |
          make spellcheck

